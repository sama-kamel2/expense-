{% extends "expenses/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 560px; margin: 0 auto;">
    <h3 class="mb-3"><i class="fa-solid fa-receipt"></i> {{ title }}</h3>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> حفظ</button>
            <a href="{% url 'expenses:dashboard' %}" class="btn btn-outline-secondary">إلغاء</a>
        </div>
    </form>
</div>
{% endblock %}
