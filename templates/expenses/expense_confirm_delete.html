{% extends "expenses/base.html" %}
{% block title %}حذف مصروف{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 480px; margin: 0 auto;">
    <h4 class="mb-3"><i class="fa-solid fa-triangle-exclamation text-danger"></i> تأكيد الحذف</h4>
    <p>هل أنت متأكد من حذف المصروف "{{ object.description|default:object.amount }}"؟</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">حذف</button>
            <a href="{% url 'expenses:dashboard' %}" class="btn btn-outline-secondary">إلغاء</a>
        </div>
    </form>
</div>
{% endblock %}
