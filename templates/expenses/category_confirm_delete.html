{% extends "expenses/base.html" %}
{% load i18n_tags %}
{% block title %}{% t "confirm_delete_title" %}{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 480px; margin: 0 auto;">
    <h4 class="mb-3"><i class="fa-solid fa-triangle-exclamation text-danger"></i> {% t "confirm_delete_title" %}</h4>
    <p>{% t "delete_category_question" name=object.name %}</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">{% t "delete" %}</button>
            <a href="{% url 'expenses:categories' %}" class="btn btn-outline-secondary">{% t "cancel" %}</a>
        </div>
    </form>
</div>
{% endblock %}
